<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bocchi - 设置</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <a class="skip-link" href="#settings-content">跳到设置内容</a>
  <div class="shell settings-shell">

    <!-- 页头:品牌锚点 + 全局总开关(与 popup 共用 globalShieldEnabled) -->
    <header class="masthead">
      <div class="brand">
        <h1 class="brand-name">Bocchi</h1>
      </div>
      <div class="masthead-actions">
        <button type="button" class="icon-btn" id="themeToggle" aria-label="切换主题"></button>
        <button type="button" class="reset-btn" id="btnResetDefaults" data-help="恢复扩展的全局默认设置；保留主题与网站例外名单。">
          <span aria-hidden="true">↺</span> 恢复默认
        </button>
        <label class="status-pill" id="statusPill" title="全局防护：关闭后暂停所有防护">
          <span class="status-text" id="statusText">全局防护</span>
          <span class="switch">
            <input type="checkbox" id="globalShieldEnabled" checked aria-label="全局防护">
            <i></i>
          </span>
        </label>
      </div>
    </header>

    <div class="settings-error-banner" id="settingsErrorBanner" role="alert" hidden>
      <div class="settings-error-copy">
        <strong>无法读取扩展设置</strong>
        <span id="settingsErrorText">当前页面不会保存任何修改。请刷新设置页重试。</span>
      </div>
      <button type="button" class="sel-btn" id="settingsRetry">刷新重试</button>
    </div>

    <div class="settings-body">
      <!-- 左侧模块导航 -->
      <nav class="settings-nav" aria-label="设置模块">
        <button type="button" class="nav-item" data-view="canvas" aria-current="page">
          画布与 3D
        </button>
        <button type="button" class="nav-item" data-view="audio">
          音频指纹
        </button>
        <button type="button" class="nav-item" data-view="webrtc">
          WebRTC
        </button>
        <button type="button" class="nav-item" data-view="timezone">
          时区与位置
        </button>
        <button type="button" class="nav-item" data-view="hardware">
          硬件指纹
        </button>
        <button type="button" class="nav-item" data-view="language">
          语言伪装
        </button>
        <button type="button" class="nav-item" data-view="fonts">
          字体指纹
        </button>
        <button type="button" class="nav-item" data-view="bypass">
          网站例外
        </button>
        <button type="button" class="nav-item" data-view="backup">
          备份与恢复
        </button>
      </nav>

      <!-- 右侧内容区 -->
      <main class="settings-content" id="settings-content" tabindex="-1">

        <!-- ═════════ 字体模块 ═════════ -->
        <section class="view" id="view-fonts" data-view="fonts">
          <div class="view-head">
            <div class="view-title">
              <h2>字体指纹</h2>
              <button type="button" class="help-trigger" data-help-view="fonts" aria-label="查看字体指纹选项说明" aria-expanded="false" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
              </button>
            </div>
            <label class="switch" title="字体指纹防护总开关">
              <input type="checkbox" id="fontProtection" checked aria-label="字体指纹防护">
              <i></i>
            </label>
          </div>

          <!-- 工具条:默认态(点阵即语义) + 语种批处理(样字即内容) + 搜索 -->
          <div class="toolbar">
            <div class="mode-seg" id="modeControl" role="group" aria-label="字体默认可见性">
              <button class="mode-btn" type="button" data-mode="blacklist" data-help="默认显示全部字体；只有你隐藏的字体对网站探测不可见。">
                <span class="mode-dots" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span>
                默认显示
              </button>
              <button class="mode-btn" type="button" data-mode="whitelist" data-help="默认隐藏全部字体；只有你放行的字体对网站可见。">
                <span class="mode-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i class="on"></i><i class="on"></i></span>
                默认隐藏
              </button>
            </div>

            <label class="search">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input type="text" id="searchInput" name="font-search" class="search-input" placeholder="搜索字体…" aria-label="搜索字体" spellcheck="false" autocomplete="off">
              <span class="kbd">/</span>
            </label>
            <span class="font-count" id="fontCount"></span>
          </div>

          <div class="font-lang-bar">
            <details class="lang-pref" id="langSelect">
              <summary class="lang-pref-trigger" aria-label="按语言筛选字体" data-help="勾选语言后，会自动选中支持这些语言的字体；再用右侧“隐藏所选/显示所选”操作。">
                <span class="ctl-label">按语言筛选</span>
                <span class="lang-pref-summary" id="langSelectSummary">多选</span>
                <span class="lang-pref-chevron" aria-hidden="true">⌄</span>
              </summary>
              <div class="lang-pref-menu" id="langSelectMenu">
                <label class="lang-pref-option"><input type="checkbox" data-lang="zh-Hans"><span>简体中文</span><span class="lang-select-count"></span></label>
                <label class="lang-pref-option"><input type="checkbox" data-lang="zh-Hant"><span>繁体中文</span><span class="lang-select-count"></span></label>
                <label class="lang-pref-option"><input type="checkbox" data-lang="en"><span>英文</span><span class="lang-select-count"></span></label>
                <label class="lang-pref-option"><input type="checkbox" data-lang="ja"><span>日文</span><span class="lang-select-count"></span></label>
                <label class="lang-pref-option"><input type="checkbox" data-lang="ko"><span>韩文</span><span class="lang-select-count"></span></label>
                <label class="lang-pref-option"><input type="checkbox" data-lang="fr"><span>法文</span><span class="lang-select-count"></span></label>
                <label class="lang-pref-option"><input type="checkbox" data-lang="pt"><span>葡萄牙文</span><span class="lang-select-count"></span></label>
                <label class="lang-pref-option"><input type="checkbox" data-lang="ar"><span>阿拉伯文</span><span class="lang-select-count"></span></label>
                <label class="lang-pref-option"><input type="checkbox" data-lang="fa"><span>波斯文</span><span class="lang-select-count"></span></label>
                <label class="lang-pref-option"><input type="checkbox" data-lang="ur"><span>乌尔都文</span><span class="lang-select-count"></span></label>
                <label class="lang-pref-option"><input type="checkbox" data-lang="he"><span>希伯来文</span><span class="lang-select-count"></span></label>
              </div>
            </details>
          </div>

          <!-- 选择操作条 -->
          <div class="select-bar" id="selectBar">
            <span class="sel-count" id="selCount">未选择</span>
            <div class="sel-actions">
              <button type="button" class="sel-btn" id="btnSelectAll" data-help="选中当前列表中的所有字体。">全选</button>
              <button type="button" class="sel-btn" id="btnInvert" data-help="反转当前列表的选中状态。">反选</button>
              <span class="sel-sep" aria-hidden="true"></span>
              <button type="button" class="sel-btn" id="btnHideSel" data-help="把当前选中的字体加入隐藏列表。" disabled>隐藏所选</button>
              <button type="button" class="sel-btn" id="btnShowSel" data-help="把当前选中的字体移出隐藏列表。" disabled>显示所选</button>
            </div>
          </div>

          <!-- 比例条 -->
          <div class="census" aria-live="polite">
            <div class="census-bar"><div class="census-vis" id="barVis"></div><div class="census-hid" id="barHid"></div></div>
            <div class="census-legend">
              <span class="cell" id="nVisCell"><b id="nVis">0</b>&nbsp;可见</span>
              <span class="cell hid" id="nHidCell"><b id="nHid">0</b>&nbsp;隐藏</span>
            </div>
          </div>

          <!-- 列表 -->
          <div class="list-container">
            <div class="cols">
              <div class="col col-select"><input type="checkbox" id="selectAllBox" aria-label="全选当前列表"></div>
              <div class="col sortable" id="headerToggle" role="button" tabindex="0" aria-sort="none" title="按状态排序">
                <span id="titleToggle">状态</span>
                <span class="sort-icon" id="iconToggle">↕</span>
              </div>
              <div class="col sortable col-name" id="headerName" role="button" tabindex="0" aria-sort="none" title="按名称 A-Z 排序">
                <span>名称</span>
                <span class="sort-icon" id="iconName">↕</span>
              </div>
            </div>
            <div id="fontRows" class="font-rows">
              <div class="no-result">正在加载底层字体库…</div>
            </div>
          </div>
        </section>

        <!-- ═════════ 语言模块 ═════════ -->
        <section class="view" id="view-language" data-view="language" hidden>
          <div class="view-head">
            <div class="view-title">
              <h2>语言伪装</h2>
              <button type="button" class="help-trigger" data-help-view="language" aria-label="查看语言伪装选项说明" aria-expanded="false" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
              </button>
            </div>
            <label class="switch" title="语言伪装开关">
              <input type="checkbox" id="languageProtection" aria-label="语言伪装">
              <i></i>
            </label>
          </div>
          <div class="view-options-stack">
            <div class="opt-row opt-row-select" data-help="让浏览器报告的语言、日期数字格式和发给网站的语言偏好保持一致。">
              <span class="opt-copy">
                <span class="opt-title">伪装为</span>
              </span>
              <select id="languageTarget" class="lang-select" aria-label="伪装语言">
                <option value="zh-CN">中文（简体，中国）</option>
                <option value="zh-TW">中文（繁体，台湾）</option>
                <option value="en-US" selected>英语（美国）</option>
                <option value="en-GB">英语（英国）</option>
                <option value="ja-JP">日语</option>
                <option value="ko-KR">韩语</option>
                <option value="fr-FR">法语</option>
                <option value="de-DE">德语</option>
                <option value="es-ES">西班牙语</option>
                <option value="pt-BR">葡萄牙语（巴西）</option>
                <option value="ru-RU">俄语</option>
                <option value="it-IT">意大利语</option>
                <option value="nl-NL">荷兰语</option>
                <option value="pl-PL">波兰语</option>
                <option value="tr-TR">土耳其语</option>
                <option value="ar-SA">阿拉伯语</option>
                <option value="hi-IN">印地语</option>
                <option value="th-TH">泰语</option>
                <option value="vi-VN">越南语</option>
                <option value="id-ID">印度尼西亚语</option>
              </select>
            </div>
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">网站读取的语言</span>
              </span>
              <span class="switch" data-help="改变网页读取到的语言列表（navigator.language / languages）。"><input type="checkbox" id="languageNavigator" checked aria-label="网站读取的语言"><i></i></span>
            </label>
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">日期与数字格式</span>
              </span>
              <span class="switch" data-help="改变日期、数字和排序使用的默认语言（Intl）。"><input type="checkbox" id="languageIntl" checked aria-label="日期与数字格式"><i></i></span>
            </label>
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">网站收到的语言偏好</span>
              </span>
              <span class="switch" data-help="改变网站收到的语言偏好（Accept-Language）。"><input type="checkbox" id="languageHeader" checked aria-label="网站收到的语言偏好"><i></i></span>
            </label>
          </div>
          <div class="lang-result" id="languageResult" aria-live="polite">
            <div class="lang-result-head">
              <span class="lang-result-title">当前结果</span>
              <span class="lang-result-state" id="languageResultState">未启用</span>
            </div>
            <div class="lang-result-grid">
              <div class="lang-result-item">
                <span class="lang-result-key">网页读取的语言</span>
                <code class="lang-result-value is-native" id="languageResultNavigator">原生</code>
              </div>
              <div class="lang-result-item">
                <span class="lang-result-key">日期和数字格式</span>
                <code class="lang-result-value is-native" id="languageResultIntl">原生</code>
              </div>
              <div class="lang-result-item">
                <span class="lang-result-key">网站收到的语言</span>
                <code class="lang-result-value is-native" id="languageResultHeader">原生</code>
              </div>
            </div>
          </div>
        </section>

        <!-- ═════════ Canvas & WebGL ═════════ -->
        <section class="view" id="view-canvas" data-view="canvas" hidden>
          <div class="view-head">
            <div class="view-title">
              <h2>画布与 3D 指纹</h2>
              <button type="button" class="help-trigger" data-help-view="canvas" aria-label="查看画布与 3D 指纹选项说明" aria-expanded="false" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
              </button>
            </div>
            <label class="switch" title="画布指纹防护开关">
              <input type="checkbox" id="canvasProtection" checked aria-label="画布指纹防护">
              <i></i>
            </label>
          </div>
          <div class="view-options view-options-stack">
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">画布像素读取</span>
              </span>
              <span class="switch" data-help="网站直接读取画布像素时加入细微噪声（getImageData）；读取仍会成功。"><input type="checkbox" id="canvas2dPixels" checked aria-label="画布像素读取"><i></i></span>
            </label>
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">画布图片导出</span>
              </span>
              <span class="switch" data-help="网站把画布保存为图片时加入细微噪声（toDataURL / toBlob）；导出仍会成功。"><input type="checkbox" id="canvas2dExport" checked aria-label="画布图片导出"><i></i></span>
            </label>
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">3D 画面读取</span>
              </span>
              <span class="switch" data-help="网站读取 3D 画面时加入细微噪声（WebGL readPixels / toDataURL）；3D 场景仍正常显示。"><input type="checkbox" id="canvasWebglExport" checked aria-label="3D 画面读取"><i></i></span>
            </label>
          </div>
        </section>

        <!-- ═════════ 音频 ═════════ -->
        <section class="view" id="view-audio" data-view="audio" hidden>
          <div class="view-head">
            <div class="view-title">
              <h2>音频指纹</h2>
              <button type="button" class="help-trigger" data-help-view="audio" aria-label="查看音频指纹选项说明" aria-expanded="false" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
              </button>
            </div>
            <label class="switch" title="音频指纹防护开关">
              <input type="checkbox" id="audioProtection" checked aria-label="音频指纹防护">
              <i></i>
            </label>
          </div>
          <div class="view-options view-options-stack">
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">音频数据读取</span>
              </span>
              <span class="switch" data-help="网站读取音频样本时加入细微噪声（AudioBuffer.getChannelData）；音频仍可正常播放。"><input type="checkbox" id="audioGetChannelData" checked aria-label="音频数据读取"><i></i></span>
            </label>
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">播放数据读取</span>
              </span>
              <span class="switch" data-help="网站读取播放数据时加入细微噪声（copyFromChannel）；关闭可提升部分网站的音频兼容性。"><input type="checkbox" id="audioCopyFromChannel" checked aria-label="播放数据读取"><i></i></span>
            </label>
          </div>
        </section>

        <!-- ═════════ WebRTC ═════════ -->
        <section class="view" id="view-webrtc" data-view="webrtc" hidden>
          <div class="view-head">
            <div class="view-title">
              <h2>WebRTC 泄露防护</h2>
              <button type="button" class="help-trigger" data-help-view="webrtc" aria-label="查看 WebRTC 选项说明" aria-expanded="false" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
              </button>
            </div>
            <label class="switch" title="WebRTC 泄露防护开关">
              <input type="checkbox" id="webrtcProtection" checked aria-label="WebRTC 泄露防护">
              <i></i>
            </label>
          </div>
          <div class="view-options view-options-stack">
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">隐藏 WebRTC 支持检测</span>
              </span>
              <span class="switch" data-help="隐藏 WebRTC 的核心接口（RTCPeerConnection、MediaStreamTrack、RTCSessionDescription），网站无法检测 WebRTC 支持；可能影响视频通话。"><input type="checkbox" id="webrtcBlockSupport" aria-label="隐藏 WebRTC 支持检测"><i></i></span>
            </label>
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">阻止摄像头和麦克风</span>
              </span>
              <span class="switch" data-help="阻止网站列出和使用摄像头、麦克风（enumerateDevices / getUserMedia）。"><input type="checkbox" id="webrtcBlockDevices" aria-label="阻止摄像头和麦克风"><i></i></span>
            </label>
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">隐藏其他 WebRTC 接口</span>
              </span>
              <span class="switch" data-help="隐藏其他 WebRTC 接口（RTCIceCandidate、RTCDataChannel、RTCConfiguration）；可能影响视频通话。"><input type="checkbox" id="webrtcBlockObjects" aria-label="隐藏其他 WebRTC 接口"><i></i></span>
            </label>
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">隐藏设备名称</span>
              </span>
              <span class="switch" data-help="隐藏摄像头、麦克风等设备的名称和编号。"><input type="checkbox" id="webrtcDevices" checked aria-label="隐藏设备名称"><i></i></span>
            </label>
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">隐藏本地 IP 地址</span>
              </span>
              <span class="switch" data-help="从 WebRTC 连接信息中移除本地网络地址（IPv4/IPv6）。"><input type="checkbox" id="webrtcLocalIp" checked aria-label="隐藏本地 IP 地址"><i></i></span>
            </label>
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">阻止 WebRTC 泄露公网 IP</span>
              </span>
              <span class="switch" data-help="阻止非代理 UDP 直连，避免网站看到你的公网 IP；关闭后视频通话更兼容。"><input type="checkbox" id="webrtcUdp" aria-label="阻止 WebRTC 泄露公网 IP"><i></i></span>
            </label>
          </div>
        </section>

        <!-- ═════════ 时间与位置 ═════════ -->
        <section class="view" id="view-timezone" data-view="timezone" hidden>
          <div class="view-head">
            <div class="view-title">
              <h2>时区与位置</h2>
              <button type="button" class="help-trigger" data-help-view="timezone" aria-label="查看时区与位置选项说明" aria-expanded="false" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
              </button>
            </div>
            <div class="tp-layer-group" role="group" aria-label="地图图层">
              <div class="tp-layer-switches">
                <label class="tp-layer-switch">
                  <span>时区伪装</span>
                  <span class="switch" data-help="让网站看到你选择的时区，而不是真实时区。">
                    <input type="checkbox" id="timezoneProtection" checked aria-label="时区伪装">
                    <i></i>
                  </span>
                </label>
                <label class="tp-layer-switch">
                  <span>位置伪装</span>
                  <span class="switch" data-help="让网站看到你选择的位置；开启后时区默认跟随位置。">
                    <input type="checkbox" id="geolocationProtection" aria-label="位置伪装">
                    <i></i>
                  </span>
                </label>
              </div>
            </div>
          </div>

          <div class="tp-console">
            <div class="tp-toolbar">
              <div class="tp-search-wrap">
                <label class="tp-search">
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.2"/>
                    <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                  </svg>
                  <input id="citySearch" type="text" placeholder="搜索城市" autocomplete="off" aria-label="搜索城市">
                  <kbd>/</kbd>
                </label>
                <div class="tp-results" id="cityResults" hidden></div>
              </div>
            </div>

            <div class="tp-map-wrap" id="tpMapWrap">
              <svg id="worldMap" viewBox="0 0 720 360" role="img" aria-label="拖动定位点设置虚拟位置">
                <rect class="tp-ocean" width="720" height="360"></rect>
                <g id="tpGraticule" class="tp-graticule"></g>
                <path id="worldPath" class="tp-land" d=""></path>
                <path id="tpIpArc" d="" hidden></path>
                <path id="tpFlightTrail" class="tp-flight-trail" d=""></path>
                <g id="tpIpMarker" class="tp-ip-marker off">
                  <title id="tpIpTitle">当前出口 IP 的大致位置</title>
                  <circle class="tp-ip-ring" r="7"></circle>
                  <text class="tp-ip-label" y="-13" text-anchor="middle">出口 IP</text>
                </g>
                <g id="tpPin" class="tp-pin" tabindex="0" role="img" aria-label="拖动设置位置">
                  <g class="tp-pin-shape">
                    <circle class="tp-pin-ring" r="7"></circle>
                    <circle class="tp-pin-dot" r="2.6"></circle>
                  </g>
                  <text class="tp-pin-label" y="-13" text-anchor="middle">东京</text>
                  <circle class="tp-pin-hit" r="17" fill="transparent" pointer-events="all"></circle>
                </g>
              </svg>
              <div class="tp-cursor" id="cursorReadout"></div>
            </div>

            <div class="tp-hud">
              <div class="tp-hud-place">
                <span class="tp-place" id="tpPlace">东京</span>
                <span class="tp-place-en" id="tpPlaceEn">(Tokyo)</span>
              </div>
              <div class="tp-clock" id="tpClock">--:--</div>
              <div class="tp-hud-meta">
                <span class="tp-daynight" id="tpDaynight" aria-hidden="true">
                  <svg class="tp-sun-icon" width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.2"/><path d="M8 1.4v1.6M8 13v1.6M1.4 8h1.6M13 8h1.6M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
                  <svg class="tp-moon-icon" width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M13.4 10.2A5.8 5.8 0 016.1 2.7a5.9 5.9 0 107.3 7.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
                </span>
                <span id="tpDate">—</span>
              </div>
              <div class="tp-hud-zone" id="tpHudZone">
                <span class="tp-zone-name" id="tpZone">Asia/Tokyo</span>
                <span class="tp-zone-offset">(<span id="tpOffset">GMT+9</span>)</span>
                <span class="tp-off-tag" id="tpTzOff" hidden>真实时区</span>
              </div>
              <button class="tp-coords" id="tpCoords" type="button" title="编辑精确坐标">
                <span id="tpCoordsText">35.6762, 139.6503</span>
                <span class="tp-inactive" id="tpCoordsOff" hidden>未生效</span>
              </button>
            </div>

            <div class="tp-dock">
              <span class="tp-dock-label">时区来源</span>
              <div class="tp-chips" role="group" aria-label="时区来源">
                <button type="button" class="tp-chip" data-tz-source="geo" data-help="时区按地图上的位置设置。" aria-pressed="false">按位置</button>
                <button type="button" class="tp-chip" data-tz-source="auto" data-help="按当前网络出口自动选择时区。" aria-pressed="true">按网络</button>
                <button type="button" class="tp-chip" data-tz-source="manual" data-help="自己从列表中选择时区。" aria-pressed="false">手动选择</button>
              </div>
              <select id="tzSelect" class="tp-zone-select" aria-label="选择时区" hidden></select>
              <button type="button" class="tp-mismatch" id="tzMismatch" hidden>
                <span class="tp-mismatch-dot"></span>
                <span>时区与位置不一致</span>
                <span class="tp-mismatch-action">对齐到位置</span>
              </button>
              <div class="tp-dock-note" id="tzNote"></div>
            </div>

            <div class="tp-coords-pop" id="coordsPop" hidden>
              <label class="tp-coords-field">纬度
                <input type="number" id="geoLat" step="0.0001" min="-90" max="90" placeholder="34.0522" inputmode="decimal">
              </label>
              <label class="tp-coords-field">经度
                <input type="number" id="geoLng" step="0.0001" min="-180" max="180" placeholder="-118.2437" inputmode="decimal">
              </label>
              <button type="button" class="tp-coords-apply" id="coordsApply">应用</button>
              <button type="button" class="tp-coords-close" id="coordsClose" aria-label="关闭坐标编辑">×</button>
            </div>
          </div>
        </section>

        <!-- ═════════ 硬件指纹 ═════════ -->
        <section class="view" id="view-hardware" data-view="hardware" hidden>
          <div class="view-head">
            <div class="view-title">
              <h2>硬件指纹</h2>
              <button type="button" class="help-trigger" data-help-view="hardware" aria-label="查看硬件指纹选项说明" aria-expanded="false" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
              </button>
            </div>
            <label class="switch" title="硬件指纹防护开关">
              <input type="checkbox" id="hardwareProtection" checked aria-label="硬件指纹防护">
              <i></i>
            </label>
          </div>
          <div class="view-options view-options-stack">
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">隐藏显卡与 WebGL 信息</span>
              </span>
              <span class="switch" data-help="替换显卡型号和 WebGL 渲染器信息，并给 readPixels 读取结果加噪。"><input type="checkbox" id="hardwareGpu" checked aria-label="隐藏显卡与 WebGL 信息"><i></i></span>
            </label>
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">统一屏幕参数</span>
              </span>
              <span class="switch" data-help="统一屏幕尺寸、色深和页面缩放比例（devicePixelRatio）。"><input type="checkbox" id="hardwareScreen" checked aria-label="统一屏幕参数"><i></i></span>
            </label>
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">限制高精度计时</span>
              </span>
              <span class="switch" data-help="把高精度计时器降到 1 毫秒（performance.now）。"><input type="checkbox" id="hardwareTimer" checked aria-label="限制高精度计时"><i></i></span>
            </label>
            <label class="opt-row">
              <span class="opt-copy">
                <span class="opt-title">隐藏游戏手柄</span>
              </span>
              <span class="switch" data-help="让网站查不到已连接的游戏手柄（getGamepads）。"><input type="checkbox" id="hardwareGamepad" aria-label="隐藏游戏手柄"><i></i></span>
            </label>
          </div>
        </section>

        <!-- ═════════ 站点旁路 ═════════ -->
        <section class="view" id="view-bypass" data-view="bypass" hidden>
          <div class="view-head">
            <div class="view-title">
              <h2>网站例外</h2>
              <button type="button" class="help-trigger" data-help-view="bypass" aria-label="查看网站例外选项说明" aria-expanded="false" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
              </button>
            </div>
          </div>
          <div class="bypass-form">
            <input id="bypassInput" name="bypass-domain" class="bypass-input" type="text" placeholder="example.com 或 https://example.com" autocomplete="off" spellcheck="false" aria-label="要加入例外的域名或网址">
            <button type="button" class="sel-btn" id="bypassAdd">添加</button>
          </div>
          <div class="bypass-status" id="bypassStatus" role="status" aria-live="polite"></div>
          <div class="view-options-stack" id="bypassList" hidden></div>
        </section>

        <!-- ═════════ 备份与恢复 ═════════ -->
        <section class="view" id="view-backup" data-view="backup" hidden>
          <div class="view-head">
            <div class="view-title">
              <h2>备份与恢复</h2>
            </div>
          </div>
          <div class="bypass-form backup-actions" role="group" aria-label="设置备份">
            <button type="button" class="sel-btn" id="exportSettings">导出设置</button>
            <button type="button" class="sel-btn" id="importSettings">导入设置</button>
            <input id="importSettingsFile" type="file" accept=".json,application/json" hidden>
          </div>
          <div class="bypass-status" id="backupStatus" role="status" aria-live="polite"></div>
        </section>

      </main>
    </div>
  </div>

  <script src="world-map.js"></script>
  <script src="panel.js"></script>
</body>
</html>
