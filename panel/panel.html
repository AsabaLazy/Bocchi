<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bocchi · 字体可见性</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="shell">

    <!-- 页头:品牌锚点 + 全局总开关(与 popup 共用 globalShieldEnabled) -->
    <header class="masthead">
      <svg class="shield" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3l7 2.6v5.2c0 4.6-3 8.2-7 9.9-4-1.7-7-5.3-7-9.9V5.6L12 3z"/>
        <circle cx="12" cy="11" r="2.1"/>
      </svg>
      <div class="brand">
        <div class="brand-name">Bocchi Privacy Shield</div>
        <div class="brand-sub">字体可见性控制</div>
      </div>
      <label class="status-pill" id="statusPill" title="扩展全局开关：关闭后所有站点不再隐藏任何字体">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text" id="statusText">防护运行中</span>
        <span class="switch">
          <input type="checkbox" id="globalShieldEnabled" checked aria-label="扩展全局开关">
          <i></i>
        </span>
      </label>
    </header>

    <!-- 工具条:默认态(点阵即语义) + 语种批处理(样字即内容) + 搜索 -->
    <div class="toolbar">
      <span class="ctl-label">默认</span>
      <div class="mode-seg" id="modeControl" role="group" aria-label="字体默认状态">
        <button class="mode-btn" type="button" data-mode="blacklist" title="默认全部可见；只有你隐藏的字体对网站探测不可见">
          <span class="mode-dots" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span>
          可见
        </button>
        <button class="mode-btn" type="button" data-mode="whitelist" title="默认全部隐藏；只有你放行的字体对网站可见">
          <span class="mode-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i class="on"></i><i class="on"></i></span>
          隐藏
        </button>
      </div>

      <label class="script-chip" id="scriptChip" title="一键隐藏阿拉伯文、天城文、泰文等冷门小语种字体（字体照常渲染，仅对网站的字体探测不可见）">
        <span class="script-glyphs" aria-hidden="true"><i>أ</i><i>अ</i><i>ก</i></span>
        <span class="switch">
          <input type="checkbox" id="toggleOtherScripts" aria-label="冷门小语种隐藏">
          <i></i>
        </span>
      </label>

      <label class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="搜索字体…" spellcheck="false" autocomplete="off">
        <span class="kbd">/</span>
      </label>
      <span class="font-count" id="fontCount"></span>
    </div>

    <!-- 选择操作条:对勾选的行批量执行 -->
    <div class="select-bar" id="selectBar">
      <span class="sel-count" id="selCount">未选择</span>
      <div class="sel-actions">
        <button type="button" class="sel-btn" id="btnSelectAll">全选</button>
        <button type="button" class="sel-btn" id="btnInvert">反选</button>
        <span class="sel-sep" aria-hidden="true"></span>
        <button type="button" class="sel-btn" id="btnHideSel" disabled>隐藏所选</button>
        <button type="button" class="sel-btn" id="btnShowSel" disabled>显示所选</button>
        <button type="button" class="sel-btn ghost" id="btnClearSel" disabled>清除</button>
      </div>
    </div>

    <!-- 比例条:可见/隐藏的统计视觉化 -->
    <div class="census" aria-live="polite">
      <div class="census-bar"><div class="census-vis" id="barVis"></div><div class="census-hid" id="barHid"></div></div>
      <div class="census-legend">
        <span class="cell" id="nVisCell"><b id="nVis">0</b>&nbsp;可见</span>
        <span class="cell hid" id="nHidCell"><b id="nHid">0</b>&nbsp;隐藏</span>
      </div>
    </div>

    <!-- 列表 -->
    <main class="list-container">
      <div class="cols">
        <div class="col col-select"><input type="checkbox" id="selectAllBox" aria-label="全选当前列表"></div>
        <div class="col sortable" id="headerToggle" role="button" tabindex="0" aria-sort="none" title="按状态排序">
          <span id="titleToggle">状态</span>
          <span class="sort-icon" id="iconToggle">↕</span>
        </div>
        <div class="col sortable col-name" id="headerName" role="button" tabindex="0" aria-sort="none" title="按名称 A-Z 排序">
          <span>名称</span>
          <span class="sort-icon" id="iconName">↕</span>
        </div>
        <div class="col sortable col-badge" id="headerCategory" role="button" tabindex="0" aria-sort="none" title="按类型排序">
          <span>类型</span>
          <span class="sort-icon" id="iconCategory">↕</span>
        </div>
      </div>
      <div id="fontRows" class="font-rows">
        <div class="no-result">正在加载底层字体库…</div>
      </div>
    </main>
  </div>

  <script src="panel.js"></script>
</body>
</html>
