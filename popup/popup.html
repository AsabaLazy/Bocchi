<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bocchi Privacy Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <h1 class="title">Bocchi Privacy Shield</h1>
      </div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">防护中</span>
      </div>
    </header>

    <!-- Master Switch Card -->
    <div class="card master-card">
      <div class="card-info">
        <span class="card-title">全局防护</span>
      </div>
      <label class="switch" title="开启或暂停全局防护">
        <input type="checkbox" id="globalShieldEnabled" checked aria-label="全局防护开关">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Current Site Bypass Card -->
    <div class="card site-card" id="siteCard">
      <div class="site-header">
        <div class="site-meta">
          <span class="site-label">当前网站</span>
          <span class="site-domain" id="siteDomain">检测中...</span>
        </div>
        <span class="site-status-badge" id="siteStatusText">受保护</span>
      </div>
      <div class="site-action">
        <span class="site-action-desc" id="siteActionDesc">对此网站暂停防护</span>
        <label class="switch switch-sm" title="对此网站暂停防护">
          <input type="checkbox" id="siteBypass" aria-label="对此网站暂停防护">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Modules Group -->
    <div class="modules-list" id="modulesList" role="group" aria-label="指纹防护模块">
      <div class="module-item" title="防止网站通过本机字体列表识别设备">
        <div class="module-info">
          <span class="module-name">字体指纹防护</span>
        </div>
        <label class="switch switch-sm" title="切换字体指纹防护">
          <input type="checkbox" id="fontProtection" checked aria-label="字体指纹防护">
          <span class="slider"></span>
        </label>
      </div>

      <div class="module-item" title="统一网页读取和发送的语言、日期与数字格式">
        <div class="module-info">
          <span class="module-name">语言伪装</span>
        </div>
        <label class="switch switch-sm" title="切换语言伪装">
          <input type="checkbox" id="languageProtection" aria-label="语言伪装">
          <span class="slider"></span>
        </label>
      </div>

      <div class="module-item" title="防止网站通过画布和 3D 画面识别设备">
        <div class="module-info">
          <span class="module-name">画布指纹防护</span>
        </div>
        <label class="switch switch-sm" title="切换画布指纹防护">
          <input type="checkbox" id="canvasProtection" checked aria-label="画布指纹防护">
          <span class="slider"></span>
        </label>
      </div>

      <div class="module-item" title="防止网站通过音频处理结果识别设备">
        <div class="module-info">
          <span class="module-name">音频指纹防护</span>
        </div>
        <label class="switch switch-sm" title="切换音频指纹防护">
          <input type="checkbox" id="audioProtection" checked aria-label="音频指纹防护">
          <span class="slider"></span>
        </label>
      </div>

      <div class="module-item" title="隐藏本地 IP 和网络信息，阻止 WebRTC 泄露">
        <div class="module-info">
          <span class="module-name">WebRTC 泄露防护</span>
        </div>
        <label class="switch switch-sm" title="切换 WebRTC 泄露防护">
          <input type="checkbox" id="webrtcProtection" checked aria-label="WebRTC 泄露防护">
          <span class="slider"></span>
        </label>
      </div>

      <div class="module-item" title="让网站看到你选择的时区，而不是真实时区">
        <div class="module-info">
          <span class="module-name">时区伪装</span>
        </div>
        <label class="switch switch-sm" title="切换时区伪装">
          <input type="checkbox" id="timezoneProtection" checked aria-label="时区伪装">
          <span class="slider"></span>
        </label>
      </div>

      <div class="module-item" title="让网站看到你选择的位置，而不是真实位置">
        <div class="module-info">
          <span class="module-name">位置伪装</span>
        </div>
        <label class="switch switch-sm" title="切换位置伪装">
          <input type="checkbox" id="geolocationProtection" aria-label="位置伪装">
          <span class="slider"></span>
        </label>
      </div>

      <div class="module-item" title="统一显卡、屏幕、CPU 和内存等信息">
        <div class="module-info">
          <span class="module-name">硬件指纹防护</span>
        </div>
        <label class="switch switch-sm" title="切换硬件指纹防护">
          <input type="checkbox" id="hardwareProtection" checked aria-label="硬件指纹防护">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Footer Action -->
    <button id="btnOpenPanel" class="btn-panel" type="button">
      <span>打开完整设置</span>
      <span class="arrow-icon">&rarr;</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
