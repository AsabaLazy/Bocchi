<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bocchi Privacy Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span class="title">Bocchi Privacy Shield</span>
      </div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">防护中</span>
      </div>
    </header>

    <!-- Master Switch Card -->
    <div class="card master-card">
      <div class="card-info">
        <span class="card-title">全局防护开关</span>
        <span class="card-desc">一键开启或暂停所有防护</span>
      </div>
      <label class="switch" title="开启或暂停全局防护">
        <input type="checkbox" id="globalShieldEnabled" checked aria-label="全局防护开关">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Current Site Bypass Card -->
    <div class="card site-card" id="siteCard">
      <div class="site-header">
        <div class="site-meta">
          <span class="site-label">当前网站</span>
          <span class="site-domain" id="siteDomain">检测中...</span>
        </div>
        <span class="site-status-badge" id="siteStatusText">受保护</span>
      </div>
      <div class="site-action">
        <span class="site-action-desc" id="siteActionDesc">对此网站暂停防护（加入例外名单）</span>
        <label class="switch switch-sm" title="对此网站暂停防护">
          <input type="checkbox" id="siteBypass" aria-label="对此网站暂停防护">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Modules Group -->
    <div class="section-title">防护模块</div>
    <div class="modules-list" id="modulesList">
      <div class="module-item" title="阻止网站通过元素尺寸和画布识别设备">
        <div class="module-info">
          <span class="module-name">字体探测防护</span>
        </div>
        <label class="switch switch-sm" title="切换字体探测防护">
          <input type="checkbox" id="fontProtection" checked aria-label="字体探测防护">
          <span class="slider"></span>
        </label>
      </div>

      <div class="module-item" title="统一浏览器语言、日期数字格式和网站收到的语言偏好">
        <div class="module-info">
          <span class="module-name">语言替换</span>
        </div>
        <label class="switch switch-sm" title="切换语言替换">
          <input type="checkbox" id="languageProtection" aria-label="语言替换">
          <span class="slider"></span>
        </label>
      </div>

      <div class="module-item" title="干扰网站读取画布和 3D 图形内容">
        <div class="module-info">
          <span class="module-name">画布与图形防护</span>
        </div>
        <label class="switch switch-sm" title="切换画布与图形防护">
          <input type="checkbox" id="canvasProtection" checked aria-label="画布与图形防护">
          <span class="slider"></span>
        </label>
      </div>

      <div class="module-item" title="干扰网站对音频特征的分析">
        <div class="module-info">
          <span class="module-name">音频防护</span>
        </div>
        <label class="switch switch-sm" title="切换音频防护">
          <input type="checkbox" id="audioProtection" checked aria-label="音频防护">
          <span class="slider"></span>
        </label>
      </div>

      <div class="module-item" title="隐藏本地网络信息，并提供可选的直连流量限制">
        <div class="module-info">
          <span class="module-name">视频通话防护</span>
        </div>
        <label class="switch switch-sm" title="切换视频通话防护">
          <input type="checkbox" id="webrtcProtection" checked aria-label="视频通话防护">
          <span class="slider"></span>
        </label>
      </div>

      <div class="module-item" title="按当前网络自动匹配日期、时间和时区">
        <div class="module-info">
          <span class="module-name">自动匹配时区</span>
        </div>
        <label class="switch switch-sm" title="切换自动匹配时区">
          <input type="checkbox" id="timezoneProtection" checked aria-label="自动匹配时区">
          <span class="slider"></span>
        </label>
      </div>

      <div class="module-item" title="向网站报告你选择的位置，而不是真实位置">
        <div class="module-info">
          <span class="module-name">模拟位置</span>
        </div>
        <label class="switch switch-sm" title="切换模拟位置">
          <input type="checkbox" id="geolocationProtection" aria-label="模拟位置">
          <span class="slider"></span>
        </label>
      </div>

      <div class="module-item" title="统一处理器、内存和逻辑核心信息">
        <div class="module-info">
          <span class="module-name">设备信息防护</span>
        </div>
        <label class="switch switch-sm" title="切换设备信息防护">
          <input type="checkbox" id="hardwareProtection" checked aria-label="设备信息防护">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Footer Action -->
    <button id="btnOpenPanel" class="btn-panel" type="button">
      <span>打开完整设置</span>
      <span class="arrow-icon">&rarr;</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
